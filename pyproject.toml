[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "on-device-private-agent"
version = "0.1.1"
description = "Offline private agent: TF-IDF retrieval + rule planner, $0 inference, browser + edge ready"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lionel Sim", email = "lionel@theaicapitol.com"}]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "evaluation", "open-source"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.urls]
Homepage = "https://github.com/lionelsimai/on-device-private-agent"
Repository = "https://github.com/lionelsimai/on-device-private-agent"
Issues = "https://github.com/lionelsimai/on-device-private-agent/issues"

[project.scripts]
private-agent = "on_device_private_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
